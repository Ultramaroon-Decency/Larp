# ===========================================================================
# Alembic Configuration
# ===========================================================================
# This file is read by Alembic CLI commands (alembic upgrade, revision, etc.)
# The database URL is loaded dynamically in env.py from .env / settings.

[alembic]
# Path to migration scripts (relative to project root)
script_location = alembic

# Migration file naming: <date>_<short_hash>_<slug>.py
# e.g. 2026_07_29_1a2b3c_create_users_table.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# Truncate auto-generated slug to 40 characters
truncate_slug_length = 40

# Prepend the project root to sys.path so "from app…" imports work
prepend_sys_path = .

# Version path separator — "os" uses the platform's native separator
version_path_separator = os

# The URL is set dynamically in env.py via settings.database_url
# Leave blank here so credentials never appear in this file.
sqlalchemy.url =


# ---------------------------------------------------------------------------
# Logging Configuration
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
